name: Core

# Builds the Rust core's release archive and tests the package against it. Run by hand on main
# with a version, it instead tags and publishes that release, as scripts/release-core.sh describes.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release to tag and publish (MAJOR.MINOR.PATCH); leave empty to only build
        required: false
        default: ""

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    if: inputs.version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          rustc --version
          cargo clippy --version
      - name: Coverage scope
        run: |
          echo 'Rust unit tests and Clippy run without private media. The ignored compressed-fixture tests are not run by this workflow; use scripts/test-rust-fixtures.sh with all three fixture paths to run them explicitly.' >> "$GITHUB_STEP_SUMMARY"
      - name: Rust tests
        run: cargo test --release --locked --manifest-path "Rust/SpatialAudioCore/Cargo.toml"
      - name: Clippy
        run: cargo clippy --all-targets --locked --manifest-path "Rust/SpatialAudioCore/Cargo.toml" -- -D warnings

  build:
    if: inputs.version == ''
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          xcodebuild -version
      - name: Build the release archive
        run: ./scripts/release-core.sh
      # Device validation only; run the workflow by hand on the revision to test.
      - name: Build unsigned Apple TV validation app
        if: github.event_name == 'workflow_dispatch'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec Examples/StreamPlayer/project.yml
          xcodebuild -project Examples/StreamPlayer/StreamPlayer.xcodeproj -scheme StreamPlayer \
            -destination 'generic/platform=tvOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/StreamPlayer" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/StreamPlayer/Build/Products/Release-appletvos/StreamPlayer.app" \
            "$RUNNER_TEMP/StreamPlayer-unsigned-tvOS.zip"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlayer-unsigned-tvOS
          path: ${{ runner.temp }}/StreamPlayer-unsigned-tvOS.zip
          retention-days: 7
      - name: Verify mixed-language host linking and unwinding
        run: ./scripts/test-mixed-host.sh
      - name: Build and test the package
        env:
          SAB_DRC_OUTPUTS_DIR: ${{ runner.temp }}/drc-outputs
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/package-tests.log"
      - name: Preserve test log and DRC outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-output
          path: |
            ${{ runner.temp }}/package-tests.log
            ${{ runner.temp }}/drc-outputs
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialAudioCore
          path: BinaryArtifacts/SpatialAudioCore.xcframework.zip

  release:
    if: inputs.version != ''
    runs-on: macos-26
    permissions:
      contents: write # pushes the release tag and creates the release
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchains
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          xcodebuild -version
      - name: Build the archive and tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release-core.sh "$VERSION"
      - name: Verify mixed-language host linking and unwinding
        run: ./scripts/test-mixed-host.sh
      - name: Build and test the package
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors
      - name: Publish the release
        run: |
          git push origin "$VERSION"
          gh release create "$VERSION" BinaryArtifacts/SpatialAudioCore.xcframework.zip --verify-tag \
            --title "$VERSION" --notes-file BinaryArtifacts/release-notes.md
